name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd backend
          # Skipped for now because package.json uses default test script that exits with 1.
          # Uncomment or modify when real tests are added:
          # npm test
          echo "Skipping backend tests as none are defined yet."

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orbit-lite-frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd orbit-lite-frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd orbit-lite-frontend
          npm test

      - name: Build Frontend
        run: |
          cd orbit-lite-frontend
          npm run build
